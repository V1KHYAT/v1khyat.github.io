<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Perplexity | Project</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    
    <link href="images/favicon.svg" rel="icon" type="image/svg+xml" sizes="32x32" media="(prefers-color-scheme: light)">
    <link href="images/favicon.svg" rel="icon" type="image/svg+xml" sizes="32x32" media="(prefers-color-scheme: dark)">
    <link href="images/favicon.png" rel="apple-touch-icon">

    <link href="css/normalize.css" rel="stylesheet" type="text/css">
    <link href="css/components.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
      body.body, html {
        margin: 0;
        padding: 0;
        background-color: var(--swatch--black-400) !important;
        height: 100vh;
        width: 100vw;
        overflow: hidden !important; /* Lock native scrolling on body */
      }
      
      body.body {
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; 
        box-sizing: border-box;
      }

      /* Massive Background Title */
      .background-project-title {
        position: fixed;
        top: 40vh; /* Aligns exactly with the top of the viewer's initial state */
        left: 50%;
        transform: translate(-50%, -70%); /* Pulls the text up so exactly 30% remains below the 40vh line */
        width: 100%;
        text-align: center;
        color: var(--swatch--beige-100);
        z-index: 1; /* Behind viewer */
        font-family: var(--_typography---font--primary-family);
        font-size: clamp(4rem, 9vw, 12rem);
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
        text-transform: uppercase;
        pointer-events: none;
        will-change: transform, opacity;
        transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .is-expanded .background-project-title {
        opacity: 0;
        transform: translate(-50%, -150%); /* Float up as it disappears */
      }

      /* Navbar Updates */
      .dynamic-navbar {
        position: fixed; 
        width: 100%; 
        top: 0; 
        left: 0; 
        z-index: 100; 
        padding: 1.5rem 2rem; 
        box-sizing: border-box;
        mix-blend-mode: difference;
        pointer-events: none;
      }
      .dynamic-navbar * {
        color: #ffffff !important;
        pointer-events: auto;
      }
      .project-navbar-title {
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .is-expanded .project-navbar-title {
        opacity: 0.7; 
        transform: translateY(0);
      }

      /* The Viewer Frame - GPU Accelerated */
      .project-viewer-frame {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translate(-50%, 0);
        z-index: 10;
        
        /* Initial dimensions: starts at 40vh (so 60vh tall) */
        width: 90vw;
        max-width: 1100px; 
        height: 60vh; 
        
        overflow-y: hidden; /* Prevent native scroll before expansion to avoid conflicts */
        background-color: var(--swatch--black-300);
        border-radius: 1.5rem 1.5rem 0 0; 
        -ms-overflow-style: none; 
        scrollbar-width: none;
        
        will-change: width, max-width, height, border-radius;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    max-width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    height 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-radius 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .project-viewer-frame.is-expanded {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        border-radius: 0;
        overflow-y: auto; /* Enable native scroll ONLY when expanded */
      }
      .project-viewer-frame::-webkit-scrollbar {
          display: none;
      }
      
      .nav-highlight-link {
          transition: opacity 0.3s ease;
          opacity: 0.4;
      }
      .nav-highlight-link.is-active {
          opacity: 1;
      }
    
      .figma-overlay {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          z-index: 10;
          cursor: pointer;
      }
</style>
</head>
<body class="body">

    <!-- Massive Background Title -->
    <div class="background-project-title">PERPLEXITY REDESIGN</div>
    
    <!-- Custom Navbar -->
    <header class="dynamic-navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Close Button & Project Name (Left) -->
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="work.html" class="navbar_link project-close-btn w-inline-block" style="text-decoration: none;" aria-label="Close project">
                    <div class="footer_nav_span u-text-style-main" style="font-size: 1.25rem; line-height: 1; padding: 0.25rem;">✕</div>
                </a>
                <div class="navbar_cta_wrap u-text-style-small u-text-trim-off project-navbar-title">
                    Perplexity Redesign
                </div>
            </div>
            
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="#sec-01" class="navbar_link w-inline-block nav-highlight-link is-active" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Introduction</div></a>
                <a href="#sec-04" class="navbar_link w-inline-block nav-highlight-link" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Redesign</div></a>
            </div>
    </header>

        <!-- Project Viewer Frame -->
    <div class="project-viewer-frame">
        <div id="sec-01" class="project-section" style="width: 100%;">
            <link rel="preload" as="image" href="images/Perplexity/01.webp">
            <img src="images/Perplexity/01.webp" loading="eager" decoding="sync" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="sec-02" class="project-section figma-container" style="width: 100%; position: relative;">
            <!-- Overlay to prevent accidental scroll hijacking until clicked -->
            <div class="figma-overlay" onclick="this.style.pointerEvents='none'" onmouseleave="this.style.pointerEvents='auto'"></div>
            <iframe style="border: none; width: 100%; aspect-ratio: 1942/904; display: block;" src="https://embed.figma.com/proto/uPE1GY3AeWoxRJnefF9cGp/Portfolio?node-id=1339-2019&viewport=721%2C166%2C0.03&scaling=scale-down-width&content-scaling=fixed&page-id=13%3A5&embed-host=share&hide-ui=1" allowfullscreen loading="eager"></iframe>
        </div>
        <div id="sec-03" class="project-section" style="width: 100%;">
            <img src="images/Perplexity/03.webp" loading="eager" decoding="sync" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="sec-04" class="project-section figma-container" style="width: 100%; position: relative;">
            <div class="figma-overlay" onclick="this.style.pointerEvents='none'" onmouseleave="this.style.pointerEvents='auto'"></div>
            <iframe style="border: none; width: 100%; aspect-ratio: 1942/954; display: block;" src="https://embed.figma.com/proto/uPE1GY3AeWoxRJnefF9cGp/Portfolio?node-id=1339-2895&viewport=721%2C166%2C0.03&scaling=scale-down-width&content-scaling=fixed&page-id=13%3A5&embed-host=share&hide-ui=1" allowfullscreen loading="lazy"></iframe>
        </div>
        <div id="sec-05" class="project-section" style="width: 100%;">
            <img src="images/Perplexity/05.webp" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="sec-06" class="project-section" style="width: 100%;">
            <!-- PDF Embed with fallback to 4.webp if PDF doesn't exist yet -->
            <iframe src="images/Perplexity/06.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH" width="100%" style="aspect-ratio: 1920/1080; border: none; display: block;" scrolling="no">
                <img src="images/Perplexity/04.webp" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
            </iframe>
        </div>
    </div>

    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const viewer = document.querySelector('.project-viewer-frame');
        const body = document.body;
        
        let isExpanded = false;
        let isAnimating = false;

        viewer.addEventListener('transitionend', (e) => {
            if (e.propertyName === 'max-width' || e.propertyName === 'width') {
                isAnimating = false;
            }
        });

        function expandViewer() {
            if (isAnimating || isExpanded) return;
            isAnimating = true;
            isExpanded = true;
            body.classList.add('is-expanded');
            viewer.classList.add('is-expanded');
        }

        window.addEventListener('wheel', (e) => {
            if (!isExpanded && e.deltaY > 0) {
                e.preventDefault();
                expandViewer();
            } else if (isExpanded && viewer.scrollTop === 0 && e.deltaY < 0) {
                e.preventDefault();
                if (isAnimating) return;
                isAnimating = true;
                isExpanded = false;
                body.classList.remove('is-expanded');
                viewer.classList.remove('is-expanded');
            }
        }, { passive: false });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isExpanded && (touchStartY - e.touches[0].clientY) > 10) {
                e.preventDefault();
                expandViewer();
            } else if (isExpanded && viewer.scrollTop === 0 && (touchStartY - e.touches[0].clientY) < -10) {
                if (isAnimating) return;
                isAnimating = true;
                isExpanded = false;
                body.classList.remove('is-expanded');
                viewer.classList.remove('is-expanded');
            }
        }, { passive: false });

        // Dynamic Navbar Highlighting
        const sections = [
            { id: 'sec-01', link: 'a[href="#sec-01"]' },
            { id: 'sec-04', link: 'a[href="#sec-04"]' }
        ];

        viewer.addEventListener('scroll', () => {
            let currentSection = sections[0];
            for (let i = 0; i < sections.length; i++) {
                const section = document.getElementById(sections[i].id);
                if (section && section.offsetTop <= viewer.scrollTop + (viewer.clientHeight / 3)) {
                    currentSection = sections[i];
                }
            }
            document.querySelectorAll('.nav-highlight-link').forEach(link => {
                link.classList.remove('is-active');
            });
            const activeLink = document.querySelector(currentSection.link);
            if (activeLink) activeLink.classList.add('is-active');
        });

        // Click to expand when collapsed
        viewer.addEventListener('click', () => {
            if (!isExpanded) expandViewer();
        });

        // Close button handler
        function closeProject(e) {
            if (e) e.preventDefault();
            const returnUrl = sessionStorage.getItem('portfolio_return_url');
            if (returnUrl && (returnUrl.includes('work') || returnUrl.includes('index') || returnUrl.endsWith('/') || returnUrl.includes('play'))) {
                window.location.href = returnUrl;
            } else if (document.referrer && document.referrer.includes(window.location.host)) {
                window.location.href = document.referrer;
            } else {
                window.location.href = 'work.html';
            }
        }

        document.querySelectorAll('.project-close-btn').forEach(btn => {
            btn.addEventListener('click', closeProject);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (isExpanded) {
                    if (isAnimating) return;
                    isAnimating = true;
                    isExpanded = false;
                    body.classList.remove('is-expanded');
                    viewer.classList.remove('is-expanded');
                    setTimeout(() => { isAnimating = false; }, 900);
                } else {
                    closeProject();
                }
            }
        });

        // Smooth Scroll for Nav Links
        document.querySelectorAll('.nav-highlight-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                if (!isExpanded) expandViewer();
                const targetId = link.getAttribute('href').substring(1);
                const targetSection = document.getElementById(targetId);
                if (targetSection) {
                    setTimeout(() => {
                        viewer.scrollTo({
                            top: targetSection.offsetTop,
                            behavior: 'smooth'
                        });
                    }, 50); // tiny delay to allow expand to start
                }
            });
        });
    });
    </script>

</body>
</html>
