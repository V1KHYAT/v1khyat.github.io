      /* The Viewer Frame - GPU Accelerated */

      }
      .project-viewer-frame.is-expanded {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        border-radius: 0;
        overflow-y: auto; /* Enable native scroll ONLY when expanded */

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const viewer = document.querySelector('.project-viewer-frame');
        const body = document.body;
        
        let isExpanded = false;
        let isAnimating = false;

        // Use transitionend event to perfectly sync the animation lock
        viewer.addEventListener('transitionend', (e) => {
            if (e.propertyName === 'max-width' || e.propertyName === 'width') {
                isAnimating = false;
            }
        });

        function expandViewer() {
            if (isAnimating || isExpanded) return;
            isAnimating = true;
            isExpanded = true;
            body.classList.add('is-expanded');
            viewer.classList.add('is-expanded');
            setTimeout(() => { isAnimating = false; }, 900);
        }

        function shrinkViewer() {
            if (isAnimating || !isExpanded) return;
            isAnimating = true;
            isExpanded = false;
            body.classList.remove('is-expanded');
            viewer.classList.remove('is-expanded');
            viewer.scrollTop = 0;
            setTimeout(() => { isAnimating = false; }, 900);
        }

        // Global scroll listener (Fixes cursor-outside-viewer bug)
        window.addEventListener('wheel', (e) => {
            if (!isExpanded && e.deltaY > 0) {
                e.preventDefault();
                expandViewer();
            } else if (isExpanded && viewer.scrollTop <= 0 && e.deltaY < 0) {
                e.preventDefault();
                shrinkViewer();
            } else if (isExpanded && !viewer.contains(e.target)) {
                // If scrolling outside the viewer while expanded, force the viewer to scroll
                viewer.scrollTop += e.deltaY;
            }
        }, { passive: false });

        // Touch support for mobile
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const deltaY = touchStartY - touchY;
            
            if (!isExpanded && deltaY > 10) {
                e.preventDefault();
                expandViewer();
            } else if (isExpanded && viewer.scrollTop <= 0 && deltaY < -10) {
                e.preventDefault();
                shrinkViewer();
            } else if (isExpanded && !viewer.contains(e.target)) {
                viewer.scrollTop += deltaY;
                touchStartY = touchY; 
            }
        }, { passive: false });

        // Smooth scroll anchors
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                if (!isExpanded) expandViewer(); // Auto expand if clicking nav
                const target = document.querySelector(this.getAttribute('href'));
                if(target) {
                    // Wait for expansion animation to finish before scrolling
                    setTimeout(() => {
                        target.scrollIntoView({ behavior: 'smooth' });
                    }, isExpanded ? 0 : 800); 
                }
            });
        });

        // Highlight active section
        const sections = document.querySelectorAll('.project-section');
        const navLinks = document.querySelectorAll('.nav-highlight-link');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    navLinks.forEach(link => {
                        if (link.getAttribute('href') === '#' + entry.target.id) {
                            link.classList.add('is-active');
                        } else {
                            link.classList.remove('is-active');
                        }
                    });
                }
            });
        }, { 
            root: viewer,
            rootMargin: '-30% 0px -30% 0px',
            threshold: 0
        });

        // Click to expand when collapsed
        viewer.addEventListener('click', () => {
            if (!isExpanded) expandViewer();
        });

        // Close button handler
        function closeProject(e) {
            if (e) e.preventDefault();
            const returnUrl = sessionStorage.getItem('portfolio_return_url');
            if (returnUrl && (returnUrl.includes('work') || returnUrl.includes('index') || returnUrl.endsWith('/') || returnUrl.includes('play'))) {
                window.location.href = returnUrl;
            } else if (document.referrer && document.referrer.includes(window.location.host)) {
                window.location.href = document.referrer;
            } else {
                window.location.href = 'work.html';
            }
        }

        document.querySelectorAll('.project-close-btn').forEach(btn => {
            btn.addEventListener('click', closeProject);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (isExpanded) shrinkViewer();
                else closeProject();
            }
        });

        sections.forEach(s => observer.observe(s));
    });
    </script>
